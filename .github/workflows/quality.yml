# Code quality and security gates of claude-code-herdr (docs/code-quality.md): ruff and lizard
# for the Python files, zizmor and actionlint for the workflows, gitleaks for secrets.
# Every job fails on findings; the thresholds come from the code as it was measured on
# 2026-11-07, so the first run is green and any regression fails.
name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, lizard)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv pinned to the version that wrote uv.lock; the tools themselves are pinned (with
      # hashes) in uv.lock and updated by Dependabot.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Install the pinned linters
        run: uv sync --locked --only-dev

      - name: ruff check (pycodestyle, pyflakes, bugbear, pyupgrade, bandit rules, mccabe <= 15)
        run: uv run --no-sync ruff check --output-format github .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      # Ceilings = today's maxima (all from check_segment in plugin/hooks/guard-main-bash.py,
      # measured 2026-11-09): cyclomatic complexity 47, 59 NLOC, 76 lines, 4 parameters. ruff holds new functions
      # to complexity 15; this keeps the exempted ones from growing.
      - name: lizard complexity ceilings
        run: uv run --no-sync lizard --languages python --exclude './.venv/*' -C 47 -T nloc=59 -L 76 -a 4 --warnings_only .

  workflows:
    name: Workflows (zizmor, actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false makes findings fail the job (with true, the action only
      # uploads SARIF and never fails).
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          advanced-security: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip
          persist-credentials: false

      # The gitleaks CLI (MIT), not gitleaks-action: no license key and no extra wrapper.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .
