# OpenSSF Scorecard (docs/code-quality.md): supply-chain posture score (pinned dependencies,
# token permissions, branch protection, security policy...). Results go to the Security tab
# and, with publish_results, to the public Scorecard API (https://scorecard.dev). It reports;
# it does not gate merges.
#
# publish_results imposes rules on this file (scorecard-action README, "Workflow
# Restrictions"): no top-level env or defaults, no workflow-level write permissions, only the
# scorecard job may have id-token: write, Ubuntu hosted runner, and only checkout,
# upload-artifact, codeql-action/upload-sarif, scorecard-action and harden-runner as steps.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1" # weekly
  branch_protection_rule: # re-score when branch protection changes

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: sign the results with the OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
