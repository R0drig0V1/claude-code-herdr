# Development tooling of claude-code-herdr (docs/code-quality.md). Not a package: the plugin's
# Python files run under the system python3 (3.9+) with no dependencies; this file only pins
# the linters CI and contributors run with `uv run` (versions locked in uv.lock).
[project]
name = "claude-code-herdr-dev"
version = "0"
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "lizard==1.24.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade (to 3.9 syntax only), flake8-bandit (ruff's port
# of Bandit's checks) and mccabe complexity.
select = ["E", "F", "W", "B", "UP", "S", "C90"]
ignore = [
    # The scripts run `git` and `herdr` from the user's PATH on purpose, always with an
    # argument list (never a shell string).
    "S603",
    "S607",
]

[tool.ruff.lint.mccabe]
# New code stays at or below 15. The only function above it today, check_segment (22), has a
# `noqa: C901` and is capped by the lizard ceiling in .github/workflows/quality.yml
# (docs/code-quality.md, "Thresholds").
max-complexity = 15
